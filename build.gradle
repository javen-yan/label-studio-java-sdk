plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.labelstudio'
version = '2.0.0'

ext {
    okhttpVersion = '4.12.0'
    jacksonVersion = '2.16.1'
    slf4jVersion = '1.7.36'
    junitVersion = '5.10.1'
    lombokVersion = '1.18.30'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
    withJavadocJar()
}

repositories {
    // 阿里云 Maven 仓库
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/spring' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    
    // Maven Central 作为备用
    mavenCentral()
}

dependencies {
    // HTTP Client
    implementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"
    
    // JSON Processing
    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation 'ch.qos.logback:logback-classic:1.2.12'
    
    // JWT Processing
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Validation
    implementation 'javax.validation:validation-api:2.0.1.Final'

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Test Dependencies
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation 'org.mockito:mockito-core:3.12.4'
    testImplementation "com.squareup.okhttp3:mockwebserver:${okhttpVersion}"
    testImplementation "org.slf4j:slf4j-simple:${slf4jVersion}"
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            pom {
                name = 'Label Studio Java SDK'
                description = 'Java SDK for Label Studio API'
                url = 'https://github.com/javen-yan/label-studio-sdk-java'
                
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                
                developers {
                    developer {
                        name = 'Label Studio Team'
                        email = 'hello@labelstud.io'
                        organization = 'HumanSignal'
                        organizationUrl = 'https://humansignal.com'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/javen-yan/label-studio-sdk-java.git'
                    developerConnection = 'scm:git:ssh://github.com:javen-yan/label-studio-sdk-java.git'
                    url = 'http://github.com/javen-yan/label-studio-sdk-java/tree/main'
                }
            }
        }
    }
}

signing {
    sign publishing.publications.maven
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}