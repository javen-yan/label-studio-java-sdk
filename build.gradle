plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.labelstudio'
version = '2.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // HTTP Client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-core:2.16.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.16.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.16.1'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'

    // Validation
    implementation 'javax.validation:validation-api:2.0.1.Final'

    // Test Dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.slf4j:slf4j-simple:2.0.9'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            pom {
                name = 'Label Studio Java SDK'
                description = 'Java SDK for Label Studio API'
                url = 'https://github.com/javen-yan/label-studio-sdk-java'
                
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                
                developers {
                    developer {
                        name = 'Label Studio Team'
                        email = 'hello@labelstud.io'
                        organization = 'HumanSignal'
                        organizationUrl = 'https://humansignal.com'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/javen-yan/label-studio-sdk-java.git'
                    developerConnection = 'scm:git:ssh://github.com:javen-yan/label-studio-sdk-java.git'
                    url = 'http://github.com/javen-yan/label-studio-sdk-java/tree/main'
                }
            }
        }
    }
}

signing {
    sign publishing.publications.maven
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}